<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Carrusel de cards</title>
    <link rel="stylesheet" href="CSS/carrusel.css">
    <script src="JS/carrusel.js" defer></script>
</head>

<body>

    <section class="carrusel">
        
        <div class="carrusel-contenedor">
            <div class="carrusel_item">
                <img src="IMG/primavera.jpg" class="carr_img">
                <div class="texto">
                    <p>Primavera</p>
                    <p class="textopeque">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Non eum consequuntur sit
                        similique, ipsam fugit quos. Molestiae consequatur fugiat doloremque cupiditate voluptatem facere,
                        quod dolorum, tempora rerum facilis iusto nemo.
                    </p>
                </div>
            </div>
            <div class="carrusel_item">
                <img src="IMG/verano.jpg" class="carr_img">
                <p class="texto">Verano</p>
            </div>
            <div class="carrusel_item">
                <img src="IMG/otono.jpg" class="carr_img">
                <p class="texto">Otoño</p>
            </div>
            <div class="carrusel_item">
                <img src="IMG/invierno.jpg" class="carr_img">
                <p class="texto">Invierno</p>
            </div>
        </div>
        
        <button class="btn prev">&#10094;</button>
        <button class="btn next">&#10095;</button>        
    </section>

    
    
    <section id="controles">
        <button id="playPause">⏸ Pausa</button>
    </section>

</body>

</html>
